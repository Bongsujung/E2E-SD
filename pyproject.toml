[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "e2esd"
version = "1.0.0"
description = "Clustering-free end-to-end spoof diarization with encoder-decoder attractors (NeurIPS 2026)"
readme = "README.md"
authors = [{name = "Bongsu Jung"}, {name = "Donghee Kim"}, {name = "Wooil Kim"}]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "numpy<2",
    "scipy>=1.7",
    "pyyaml",
    "tqdm",
    "soundfile==0.12.1",   # 0.14.0 (libsndfile 1.2.2) cannot decode some ASVspoof 2021 flac files
    "intervaltree>=3.0",   # for dscore
]

[project.optional-dependencies]
data = ["gdown>=4.7"]      # for scripts/download_partialspoof.sh (v1.3 timestamps on Google Drive)
log = ["tensorboard"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["e2esd*"]

[tool.setuptools.package-data]
"e2esd._vendor.dscore" = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
